name: Deploy to GitHub Pages

# 公開前ゲート → 検査つきビルド → Pages 公開を1つの workflow で直列化する。
# secret-scan が落ちたら build は skip され、Pages には何も公開されない。
# build ジョブは typecheck / lint / build / test を通し、どれかが落ちれば deploy へ進まない
# （ローカルで打った人だけが気づく検査は、実質的に無いのと同じなのでここに置く）。

on:
  push:
    branches: [main]
  # main へ入る前に同じ検査を通す。公開の瞬間がゲートの初走行、という状態を避ける。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小権限。書き込みが要るのは deploy job のみ（下で job 単位に付与）。
permissions:
  contents: read

# PR の検査実行が main の公開実行を巻き込んで打ち切らないよう、ref ごとに分ける。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 平文シークレットの混入を全コミット履歴に対して検査する。
  # build はこの job を needs にするため、ここで落ちると公開に進まない。
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全コミット履歴を走査する
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --no-banner --redact

  build:
    name: Build (static export)
    needs: secret-scan # スキャン通過が前提。fail 時は skip され公開されない。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          # プロジェクトページ（owner.github.io/<repo>/）配信のサブパスをアセットに反映する。
          # 未設定だと /_next/... をルートへ取りに行き、公開初回から全 404 になる。
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      # テストは build の後に置く。test/guards.test.mjs が out/ を検査するため
      # （クライアントバンドルへの URL 漏れ・画面と構造化データの不一致は、
      #   書き出した結果を見ないと判定できない）。
      - run: pnpm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    # 公開は main への push のときだけ。pull_request では検査までで止める。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
